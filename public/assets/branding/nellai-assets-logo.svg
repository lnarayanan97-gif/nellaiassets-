<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Radial Gold Gradient -->
    <radialGradient id="goldRim" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#FCE08B" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#805A17" />
    </radialGradient>
    
    <!-- Inner Sky/Sunrise Gradient -->
    <radialGradient id="skyGlow" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#FFF2D6" />
      <stop offset="50%" stop-color="#FCE1A6" />
      <stop offset="85%" stop-color="#E8BE65" />
      <stop offset="100%" stop-color="#C6922A" />
    </radialGradient>

    <!-- Deep Green Branding Gradient -->
    <linearGradient id="deepGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#184330" />
      <stop offset="100%" stop-color="#0E281C" />
    </linearGradient>

    <!-- Leaf Green Gradient -->
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B8A44" />
      <stop offset="100%" stop-color="#144C27" />
    </linearGradient>

    <!-- Golden Skyline Gradient -->
    <linearGradient id="goldTower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E4B2" />
      <stop offset="50%" stop-color="#D9A83E" />
      <stop offset="100%" stop-color="#9E6B15" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#553A08" flood-opacity="0.5"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Dark Ring -->
  <circle cx="300" cy="300" r="294" fill="#0C2419" stroke="#E6BE65" stroke-width="4"/>
  
  <!-- Outer Gold Rim Medallion -->
  <circle cx="300" cy="300" r="286" fill="url(#goldRim)" filter="url(#goldGlow)" />
  <circle cx="300" cy="300" r="268" fill="#123F2B" stroke="#805A17" stroke-width="2"/>
  <circle cx="300" cy="300" r="262" fill="url(#goldRim)" />
  <circle cx="300" cy="300" r="256" fill="#FBF8EE" />

  <!-- Inner Sky & Sunrise Scene Background -->
  <circle cx="300" cy="300" r="254" fill="url(#skyGlow)" />

  <!-- Scenic Township Silhouette & Towers in Background -->
  <g opacity="0.35">
    <rect x="180" y="240" width="22" height="120" fill="#755014" />
    <rect x="206" y="220" width="28" height="140" fill="#65420D" />
    <rect x="360" y="210" width="26" height="150" fill="#755014" />
    <rect x="390" y="235" width="24" height="125" fill="#65420D" />
    <rect x="418" y="255" width="30" height="105" fill="#755014" />
  </g>

  <!-- Golden Central Skyline / Towers inside Logo Crest -->
  <g id="centralSkyscrapers" filter="url(#softShadow)">
    <!-- Tower Left -->
    <polygon points="248,125 268,95 268,230 248,230" fill="url(#goldTower)" stroke="#AA771C" stroke-width="1.5"/>
    <polygon points="268,95 288,110 288,230 268,230" fill="#AA771C" />
    <line x1="258" y1="120" x2="258" y2="230" stroke="#FFF" stroke-opacity="0.6" stroke-width="1.5" />
    <line x1="278" y1="110" x2="278" y2="230" stroke="#FFE9A3" stroke-opacity="0.6" stroke-width="1.5" />

    <!-- Tower Center (Tallest) -->
    <polygon points="290,90 310,65 310,230 290,230" fill="url(#goldTower)" stroke="#AA771C" stroke-width="1.5"/>
    <polygon points="310,65 330,80 330,230 310,230" fill="#805A17" />
    <line x1="300" y1="85" x2="300" y2="230" stroke="#FFF" stroke-opacity="0.7" stroke-width="1.5" />
    <line x1="320" y1="80" x2="320" y2="230" stroke="#FFE9A3" stroke-opacity="0.6" stroke-width="1.5" />

    <!-- Tower Right -->
    <polygon points="334,130 354,115 354,230 334,230" fill="url(#goldTower)" stroke="#AA771C" stroke-width="1.5"/>
    <polygon points="354,115 370,125 370,230 354,230" fill="#AA771C" />
    <line x1="344" y1="125" x2="344" y2="230" stroke="#FFF" stroke-opacity="0.6" stroke-width="1.5" />
  </g>

  <!-- Green Roof Outline & Gables -->
  <g id="roofAndHouse" filter="url(#softShadow)">
    <!-- Main Triangular Gable Roof Peak -->
    <polygon points="310,105 450,225 435,235 310,130 185,235 170,225" fill="#123F2B" stroke="#D4AF37" stroke-width="2"/>
    
    <!-- Chimney / Pillar Accent -->
    <rect x="375" y="105" width="22" height="120" fill="#123F2B" rx="3" stroke="#D4AF37" stroke-width="1.5"/>

    <!-- Golden Window Panes in Apex -->
    <g transform="translate(296, 150)">
      <rect x="0" y="0" width="12" height="12" fill="#E8B744" rx="1.5" stroke="#7A530F" stroke-width="1"/>
      <rect x="16" y="0" width="12" height="12" fill="#E8B744" rx="1.5" stroke="#7A530F" stroke-width="1"/>
      <rect x="0" y="16" width="12" height="12" fill="#E8B744" rx="1.5" stroke="#7A530F" stroke-width="1"/>
      <rect x="16" y="16" width="12" height="12" fill="#E8B744" rx="1.5" stroke="#7A530F" stroke-width="1"/>
    </g>

    <!-- Sweeping Golden Arch across Roof Peak -->
    <path d="M 180 205 Q 260 190 310 240 Q 370 295 440 280" fill="none" stroke="url(#goldRim)" stroke-width="12" stroke-linecap="round" filter="url(#softShadow)"/>
  </g>

  <!-- Organic Green Leaf Symbol on the Left -->
  <g id="leafAccent" transform="translate(195, 140)">
    <path d="M 28 65 C 28 30 55 5 55 5 C 55 5 65 35 50 65 C 40 85 28 75 28 65 Z" fill="url(#leafGreen)" stroke="#E0B25B" stroke-width="1.5"/>
    <path d="M 10 75 C 10 50 32 28 32 28 C 32 28 38 52 26 75 C 18 90 10 82 10 75 Z" fill="url(#leafGreen)" stroke="#E0B25B" stroke-width="1.5"/>
  </g>

  <!-- Foreground Boulevard Road with Yellow Lines (Township Entrance) -->
  <g id="boulevardEntrance">
    <path d="M 140 500 L 260 380 L 340 380 L 460 500 Z" fill="#D1C7B2" opacity="0.65"/>
    <!-- Road Curvature -->
    <path d="M 155 500 L 275 385 L 325 385 L 445 500 Z" fill="#3D3A37"/>
    <!-- Road Lane Divider Lines -->
    <path d="M 298 390 L 296 410" stroke="#FFF" stroke-width="2.5" opacity="0.9"/>
    <path d="M 295 425 L 293 450" stroke="#FFF" stroke-width="3" opacity="0.9"/>
    <path d="M 291 465 L 288 495" stroke="#FFF" stroke-width="4" opacity="0.9"/>
    <!-- Street Lamp Post on Left -->
    <line x1="165" y1="420" x2="165" y2="475" stroke="#222" stroke-width="2.5"/>
    <path d="M 165 420 Q 175 410 185 418" fill="none" stroke="#222" stroke-width="2"/>
    <circle cx="185" cy="420" r="3.5" fill="#FFEAA8" />
  </g>

  <!-- Prominent Entrance Monument on Right -->
  <g id="entranceGatePillar" transform="translate(385, 360)">
    <rect x="0" y="15" width="85" height="110" fill="#EFE8D6" stroke="#AA771C" stroke-width="1.5" rx="2" filter="url(#softShadow)"/>
    <rect x="-5" y="10" width="95" height="8" fill="#AA771C" rx="1"/>
    <rect x="10" y="32" width="65" height="60" fill="#DFD6BE" stroke="#805A17" stroke-width="1" rx="1"/>
    <polygon points="42,42 32,58 52,58" fill="#123F2B" />
    <text x="42" y="70" font-family="'Times New Roman', Georgia, serif" font-weight="bold" font-size="10" fill="#123F2B" text-anchor="middle" letter-spacing="1">NELLAI</text>
    <text x="42" y="80" font-family="'Times New Roman', Georgia, serif" font-size="6.5" fill="#755014" text-anchor="middle" letter-spacing="1.5">— ASSETS —</text>
  </g>

  <!-- Main Brand Banner Area -->
  <g id="brandTypography">
    <!-- NELLAI Title with Deep Green Serif Font -->
    <text x="300" y="315" 
          font-family="'Times New Roman', 'Playfair Display', Georgia, serif" 
          font-weight="900" 
          font-size="68" 
          fill="#123F2B" 
          stroke="#092015"
          stroke-width="1.5"
          text-anchor="middle" 
          letter-spacing="12"
          filter="url(#softShadow)">NELLAI</text>

    <!-- ASSETS with Warm Gold Letter-Spacing -->
    <g transform="translate(0, 360)">
      <line x1="140" y1="-8" x2="195" y2="-8" stroke="#9E6B15" stroke-width="3"/>
      <text x="300" y="0" 
            font-family="'Times New Roman', 'Playfair Display', Georgia, serif" 
            font-weight="bold" 
            font-size="34" 
            fill="#805A17" 
            text-anchor="middle" 
            letter-spacing="12">ASSETS</text>
      <line x1="405" y1="-8" x2="460" y2="-8" stroke="#9E6B15" stroke-width="3"/>
    </g>

    <!-- Tagline: YOUR ASSET'S ADVISER -->
    <g transform="translate(0, 395)">
      <line x1="165" y1="-5" x2="205" y2="-5" stroke="#AA771C" stroke-width="1.5"/>
      <circle cx="208" cy="-5" r="2.5" fill="#AA771C"/>
      <text x="300" y="0" 
            font-family="'Times New Roman', Georgia, sans-serif" 
            font-weight="bold" 
            font-size="16" 
            fill="#18352A" 
            text-anchor="middle" 
            letter-spacing="4.5">YOUR ASSET'S ADVISER</text>
      <circle cx="392" cy="-5" r="2.5" fill="#AA771C"/>
      <line x1="395" y1="-5" x2="435" y2="-5" stroke="#AA771C" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Bottom Crest Ornament -->
  <polygon points="300,420 306,428 300,436 294,428" fill="#AA771C"/>

</svg>
